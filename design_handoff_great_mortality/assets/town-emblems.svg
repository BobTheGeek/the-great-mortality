<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 60" width="420" height="60" color="#4a2f1d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
